.brand{text-align:center;margin:10px 0 18px}

.bar{height:8px;background:var(--bd);border-radius:8px;margin:10px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .25s}
.q{font-size:19px;font-weight:700;line-height:1.45;margin:0 0 16px}

.opt.sel{border-color:var(--pri);background:var(--sel)}
.opt.sel b{background:var(--pri);color:#fff}

.rv em{font-style:normal;color:var(--ok);font-weight:700}

<div class="grid" id="grid"></div></div>
<div class="card screen" id="s6">

</div>
</div>

v.innerHTML="";var n=0;Q.forEach(function(q,i){if(ans[i]!==q.a){n++;var d=document.createElement("div");d.innerHTML="<span></span><br>Your answer: <span></span><br>Correct: <em></em>";var s=d.getElementsByTagName("span"),e=d.getElementsByTagName("em");s[0].textContent=(i+1)+". "+q.q;s[1].textContent=ans[i];e[0].textContent=q.a;v.appendChild(d)}});
if(!n)v.textContent="All answers are correct. Great!";v.style.display="block";this.textContent="Hide Wrong Answers"};
$("b5").onclick=start;
$("b6").onclick=function(){stopPoll();setRole("s");$("u").value="";$("p").value="";$("n").value="";$("f").value="";$("c").value="";$("t").value="";go("s1")};
var DB={put:function(id,o){if(CFG){try{fetch(CFG+"/sessions/"+id+".json",{method:"PUT",body:JSON.stringify(o)}).catch(function(){})}catch(e){}}else{try{var m=JSON.parse(localStorage.getItem("cbas")||"{}");m[id]=o;localStorage.setItem("cbas",JSON.stringify(m))}catch(e){}}},
all:function(cb){if(CFG){fetch(CFG+"/sessions.json").then(function(r){return r.json()}).then(function(d){cb(d||{})}).catch(function(){})}else{try{cb(JSON.parse(localStorage.getItem("cbas")||"{}"))}catch(e){cb({})}}},
clear:function(cb){if(CFG){fetch(CFG+"/sessions.json",{method:"DELETE"}).then(cb).catch(function(){})}else{try{localStorage.removeItem("cbas")}catch(e){}cb()}}};
function sync(){if(!sid)return;var lg=[];for(var i=0;i<ans.length;i++)if(ans[i]!=null)lg.push({q:Q[i].q,a:Q[i].a,p:ans[i]});
var cur=idx<Q.length?{q:Q[idx].q,o:Q[idx].o,p:pick}:null;
DB.put(sid,{n:S.n,f:S.f,c:S.c,t:S.t,i:idx,tot:Q.length,s:score,d:done,cur:cur,lg:lg,ts:Date.now()})}
var T=null,data={},openId=null;
function startPoll(){openId=null;pull();T=setInterval(pull,3000)}
function stopPoll(){if(T)clearInterval(T);T=null}
function pull(){DB.all(function(d){data=d;if(openId)drawDetail();else drawList()})}
function st(d){return d.d?["Finished","ok"]:(Date.now()-d.ts<180000?["Live","live"]:["Idle","idle"])}
function drawList(){var g=$("grid");g.innerHTML="";var ids=Object.keys(data).sort(function(a,b){return data[b].ts-data[a].ts});
$("tc").textContent=ids.length+" student"+(ids.length===1?"":"s")+" \u2022 "+(CFG?"Online sync":"Offline mode (this device only)");
if(!ids.length){g.innerHTML='<p class="sub">No students yet. They appear here when they start the test.</p>';return}
ids.forEach(function(id){var d=data[id],s=st(d),b=document.createElement("button");b.type="button";b.className="stu";
b.innerHTML='<b></b><small></small><div class="bar"><i></i></div><div class="row"><span></span><em></em></div>';
b.querySelector("b").textContent=d.n;b.querySelector("small").textContent=d.f+" \u2022 "+d.t;b.querySelector("i").style.width=(d.i/d.tot*100)+"%";
var c=b.querySelector("span");c.textContent=s[0];c.className="chip "+s[1];b.querySelector("em").textContent="Q "+Math.min(d.i+1,d.tot)+"/"+d.tot+" \u2022 Score "+d.s;
b.onclick=function(){openId=id;go("s6");drawDetail()};g.appendChild(b)})}
function drawDetail(){var d=data[openId];if(!d)return;var s=st(d);$("dh").textContent=d.n;
$("di").textContent="Father: "+d.f+" \u2022 Caste: "+d.c+" \u2022 Shift: "+d.t+" \u2022 "+s[0]+" \u2022 Score "+d.s+"/"+d.tot;$("dp").style.width=(d.i/d.tot*100)+"%";
var c=$("dcur");c.innerHTML="";if(d.cur){var q=document.createElement("p");q.className="q";q.textContent="Q"+(d.i+1)+". "+d.cur.q;c.appendChild(q);
(d.cur.o||[]).forEach(function(o,i){var x=document.createElement("div");x.className="opt"+(i===d.cur.p?" sel":"");x.innerHTML="<b>"+"ABCD".charAt(i)+"</b><span></span>";x.lastChild.textContent=o;c.appendChild(x)})}
else c.textContent="Test finished. Final score: "+d.s+" / "+d.tot;
var l=$("dlog");l.innerHTML="";var lg=d.lg||[];for(var k=lg.length-1;k>=0;k--){var r=lg[k],x=document.createElement("div");x.className=r.p===r.a?"good":"bad2";
x.textContent=(k+1)+". "+r.q+" \u2192 "+r.p+(r.p===r.a?"  \u2714":"  \u2718 (Correct: "+r.a+")");l.appendChild(x)}}
$("b9").onclick=function(){openId=null;go("s5");drawList()};
$("b7").onclick=$("b6").onclick;
$("b8").onclick=function(){if(confirm("Delete all student records?"))DB.clear(function(){data={};drawList()})};
})();
